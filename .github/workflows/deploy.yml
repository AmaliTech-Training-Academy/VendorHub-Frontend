name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue deploys instead of cancelling: a half-finished S3 sync would leave
# the site with HTML pointing at chunks that were never uploaded.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC token for assuming the AWS deploy role

jobs:
  preflight:
    name: Preflight
    uses: ./.github/workflows/preflight.yml

  deploy:
    name: Deploy to S3 + CloudFront
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Must match the `sub` condition in the IAM role's trust policy
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and deploy
        # Via bash so a lost executable bit (e.g. a merge from a core.fileMode=false
        # checkout) can't break the release.
        run: bash deploy/deploy.sh
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
