name: Preflight

on:
  pull_request:
  push:
    branches: [develop]
  # Deploy calls this so main is checked again before anything ships
  workflow_call:

concurrency:
  group: preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint is type-aware and needs Next's generated PageProps/LayoutProps,
      # which don't exist in a fresh checkout.
      - name: Generate route types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
